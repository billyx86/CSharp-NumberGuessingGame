name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update -qq && sudo apt-get install -y mono-complete
      - name: Compile
        run: |
          mkdir -p BasicGuessingGame/bin
          mcs -warn:4 -out:BasicGuessingGame/bin/Guess.exe BasicGuessingGame/Program.cs BasicGuessingGame/GameEngine.cs
      - name: Unit tests (GameEngine, deterministic via injected seed)
        run: |
          mkdir -p BasicGuessingGame.Tests/bin
          mcs -warn:4 -out:BasicGuessingGame.Tests/bin/GameEngineTests.exe \
            BasicGuessingGame.Tests/GameEngineTests.cs BasicGuessingGame/GameEngine.cs
          mono BasicGuessingGame.Tests/bin/GameEngineTests.exe
      - name: Smoke test (invalid input no longer silently treated as 0)
        run: printf 'abc\n' | mono BasicGuessingGame/bin/Guess.exe | grep -q 'Invalid number'
      - name: Smoke test (EOF exits cleanly)
        run: printf '' | mono BasicGuessingGame/bin/Guess.exe | grep -q 'Input closed. Goodbye!'
      - name: Smoke test (guaranteed win by guessing 0-99, limit raised to 200)
        run: seq 0 99 | mono BasicGuessingGame/bin/Guess.exe 200 | grep -q 'Correct! You have guessed the number.'
      - name: Smoke test (high out-of-range guess is rejected, not "too high")
        run: |
          # || true: the game now exits non-zero on abort/loss (issue #17);
          # the assertion is on the output, not the exit code.
          OUT=$(printf '150\n' | mono BasicGuessingGame/bin/Guess.exe 50) || true
          echo "$OUT"
          echo "$OUT" | grep -q 'Please enter a number between 0 and 99'
          ! echo "$OUT" | grep -q 'too high'
      - name: Smoke test (low out-of-range guess is rejected, not "too low")
        run: |
          # || true: issue #17 — non-zero exit on abort/loss must not trip set -e.
          OUT=$(printf '%s\n' '-5' | mono BasicGuessingGame/bin/Guess.exe 50) || true
          echo "$OUT"
          echo "$OUT" | grep -q 'Please enter a number between 0 and 99'
          ! echo "$OUT" | grep -q 'too low'
      - name: Smoke test (player can lose when the guess limit is hit)
        run: |
          for i in $(seq 1 20); do
            # || true: issue #17 — this path exits 1 (loss) by design.
            OUT=$(printf '0\n1\n2\n' | mono BasicGuessingGame/bin/Guess.exe 3) || true
            if echo "$OUT" | grep -q 'ran out of guesses'; then
              echo "Observed the loss path on attempt $i"
              echo "$OUT" | grep -q 'The number was'
              exit 0
            fi
          done
          echo "Never observed the loss path in 20 attempts (extremely unlikely)" >&2
          exit 1
      - name: "Smoke test (seeded round is deterministic — guaranteed loss, secret 24)"
        run: |
          # || true: issue #17 — seeded loss exits 1 by design.
          OUT=$(printf '0\n1\n2\n' | mono BasicGuessingGame/bin/Guess.exe 3 1) || true
          echo "$OUT"
          echo "$OUT" | grep -q 'ran out of guesses'
          echo "$OUT" | grep -q 'The number was 24'
      - name: "Smoke test (seeded round is deterministic — guaranteed win on one guess)"
        run: |
          OUT=$(printf '24\n' | mono BasicGuessingGame/bin/Guess.exe 10 1)
          echo "$OUT"
          echo "$OUT" | grep -q 'Correct! You have guessed the number.'
      - name: "Smoke test (custom range [min] [max], issue #12 — seed 1, 10-50, secret 20)"
        run: |
          OUT=$(printf '20\n' | mono BasicGuessingGame/bin/Guess.exe 10 1 10 50)
          echo "$OUT"
          echo "$OUT" | grep -q 'between 10-50'
          echo "$OUT" | grep -q 'Correct! You have guessed the number.'
      - name: Smoke test (invalid guess limit falls back to 10 and says so)
        run: |
          # || true: issue #17 — EOF abort exits 2 by design.
          OUT=$(printf '' | mono BasicGuessingGame/bin/Guess.exe abc) || true
          echo "$OUT"
          echo "$OUT" | grep -q 'is not a valid guess limit'
          echo "$OUT" | grep -q 'You have 10 guesses'
      - name: Smoke test (guess limit above the cap is clamped to 100 and says so)
        run: |
          # || true: issue #17 — EOF abort exits 2 by design.
          OUT=$(printf '' | mono BasicGuessingGame/bin/Guess.exe 999999999) || true
          echo "$OUT"
          echo "$OUT" | grep -q 'above the maximum of 100'
          echo "$OUT" | grep -q 'You have 100 guesses'
      - name: Smoke test (play-again prompt appears after a win)
        run: seq 0 99 | mono BasicGuessingGame/bin/Guess.exe 200 | grep -q 'Play again? (y/n)'
      - name: "Smoke test (exit codes surface the session outcome, issue #17)"
        run: |
          # The game exits non-zero on loss/abort by design (issue #17), so
          # the pipelines below would trip set -e. Capture $? (the pipeline's
          # exit status = mono's) while set +e, then assert on the values.
          set +e
          seq 0 99 | mono BasicGuessingGame/bin/Guess.exe 200 >/dev/null
          win=$?
          printf '0\n1\n2\n' | mono BasicGuessingGame/bin/Guess.exe 3 1 >/dev/null
          loss=$?
          printf '' | mono BasicGuessingGame/bin/Guess.exe >/dev/null
          abort=$?
          mono BasicGuessingGame/bin/Guess.exe -h >/dev/null
          help=$?
          set -e
          test "$win" -eq 0 || { echo "win: want 0, got $win"; exit 1; }
          test "$loss" -eq 1 || { echo "loss: want 1, got $loss"; exit 1; }
          test "$abort" -eq 2 || { echo "abort: want 2, got $abort"; exit 1; }
          test "$help" -eq 3 || { echo "help: want 3, got $help"; exit 1; }
          echo "All exit-code assertions passed"
      - name: "Smoke test (Windows-console help idioms print usage and exit 3, issue #20)"
        run: |
          set +e
          for FLAG in '/?' '/help' '-help' 'help'; do
            OUT=$(mono BasicGuessingGame/bin/Guess.exe "$FLAG")
            code=$?
            echo "$OUT" | grep -q 'Usage: Guess.exe' || { echo "$FLAG: usage text missing"; exit 1; }
            ! echo "$OUT" | grep -q 'not a valid guess limit' || { echo "$FLAG: treated as a guess limit"; exit 1; }
            ! echo "$OUT" | grep -q 'Guess a number' || { echo "$FLAG: started a round"; exit 1; }
            [ "$code" -eq 3 ] || { echo "$FLAG: want exit 3, got $code"; exit 1; }
            echo "$FLAG: usage + exit 3 OK"
          done
          set -e
      - name: "Smoke test (extra positional args are announced, issue #18)"
        run: |
          # || true: issue #17 — EOF abort exits 2 by design.
          OUT=$(printf '' | mono BasicGuessingGame/bin/Guess.exe 10 1 10 50 999) || true
          echo "$OUT"
          echo "$OUT" | grep -q 'Ignoring extra argument "999"'
          echo "$OUT" | grep -q 'between 10-50'
      - name: "Smoke test (in-round help/? prints a reminder and does not consume a guess, issue #23)"
        run: |
          # Seed 1 -> secret 24, limit 2: 'help' and '?' must not consume
          # guesses, so the round still wins with the two valid guesses.
          OUT=$(printf 'help\n?\n0\n24\n' | mono BasicGuessingGame/bin/Guess.exe 2 1)
          echo "$OUT"
          echo "$OUT" | grep -q 'Number is between 0 and 99' || { echo "reminder missing"; exit 1; }
          echo "$OUT" | grep -q 'guesses left' || { echo "reminder missing the guess count"; exit 1; }
          echo "$OUT" | grep -q 'Correct! You have guessed the number.' || { echo "help/? consumed a guess"; exit 1; }
          ! echo "$OUT" | grep -q 'Invalid number' || { echo "help/? rejected as invalid input"; exit 1; }
      - name: "Smoke test (in-round q/quit/exit ends the session cleanly, issue #24)"
        run: |
          # || true: issue #17 — quit exits 2 (the same code as an abort) by design.
          set +e
          OUT=$(printf 'q\n' | mono BasicGuessingGame/bin/Guess.exe 5 1)
          code=$?
          set -e
          echo "$OUT"
          echo "$OUT" | grep -q 'Goodbye!' || { echo "no goodbye line"; exit 1; }
          ! echo "$OUT" | grep -q 'Invalid number' || { echo "q rejected as invalid input"; exit 1; }
          ! echo "$OUT" | grep -q 'ran out of guesses' || { echo "quit counted as a loss"; exit 1; }
          test "$code" -eq 2 || { echo "quit: want exit 2, got $code"; exit 1; }

  # Windows / MSBuild build path (issue #22): builds both .NET Framework 4.7.2
  # csproj projects with MSBuild (not just mcs), runs the MSBuild-built
  # unit-test exe and asserts it reports the same pass count as the Mono
  # path, and syntax-validates run-tests.ps1 with the real PowerShell parser.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build solution (MSBuild — both csproj projects, net472)
        run: msbuild BasicGuessingGame.sln /nologo /m /v:minimal /p:Configuration=Release /p:Platform=AnyCPU
      - name: Run MSBuild unit-test exe and assert the same pass count as the Mono path
        shell: bash
        run: |
          OUT=$(./BasicGuessingGame.Tests/bin/Release/GameEngineTests.exe)
          echo "$OUT" | tail -n 3
          echo "$OUT" | grep -q '189 passed, 0 failed' || { echo "Windows/MSBuild pass-count drift (want '189 passed, 0 failed')"; exit 1; }
          echo "Windows/MSBuild unit tests: 189 passed, 0 failed"
      - name: Syntax-validate run-tests.ps1 (PowerShell parser)
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\run-tests.ps1).Path, [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "ps1 parse error: $_" }
            throw "run-tests.ps1 has $($errors.Count) parse error(s)"
          }
          Write-Host "run-tests.ps1 parses cleanly"
